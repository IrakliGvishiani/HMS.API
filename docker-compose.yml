services:
  hms.api:
    image: ${DOCKER_REGISTRY-}hmsapi
    build:
      context: .
      dockerfile: HMS.API/Dockerfile
    depends_on:
      - sqlserver
      - redis
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HMS;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Redis__ConnectionString=redis:6379
      - JWT__Secret=${JWT_SECRET}
      - EmailSettings__UserName=${SMTP_USERNAME}
      - EmailSettings__Password=${SMTP_PASSWORD}

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  redis:
    image: redis:latest
    container_name: hms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sqlserver_data:
    external: true
  redis_data:
    external: true