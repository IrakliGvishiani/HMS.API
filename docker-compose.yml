services:

  hms.api:
    image: ${DOCKER_REGISTRY-}hmsapi

    build:
      context: .
      dockerfile: HMS.API/Dockerfile

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "80:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HMS;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;

      - Redis__ConnectionString=redis:6379

      - JWT__Secret=${JWT_SECRET}
      - EmailSettings__SmtpServer=smtp-relay.brevo.com
      - EmailSettings__Port=2525
      - EmailSettings__UseSsl=false
      - EmailSettings__Sender=irakligvidhiani@gmail.com
      - EmailSettings__Username=${SMTP_USERNAME}
      - EmailSettings__Password=${SMTP_PASSWORD}

      - AppSettings__BaseUrl=http://localhost

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: hms-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -N -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - sqlserver_data:/var/opt/mssql


  redis:
    image: redis:latest

    container_name: hms-redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - redis_data:/data


volumes:
  sqlserver_data:
  redis_data:
